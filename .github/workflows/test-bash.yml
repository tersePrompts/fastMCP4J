name: MCP Integration Test - Sandboxed Bash

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test-bash:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: 📦 Install Python MCP SDK
        run: |
          pip install --upgrade pip
          pip install mcp
          python -c "import mcp; print('✓ MCP SDK installed')"

      - name: 🔨 Build project
        run: mvn -q clean package -DskipTests

      - name: 🧪 Run sandboxed bash MCP test
        run: |
          echo "::group::Test Execution"
          timeout 120 python python-tests/test_bash_stdio.py
          echo "::endgroup::"
        env:
          PYTHONUNBUFFERED: 1
